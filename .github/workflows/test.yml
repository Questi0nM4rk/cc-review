name: Integration Tests

on:
  push:
    paths:
      - '.claude/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.claude/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run integration tests
        run: bash tests/integration/run.sh
