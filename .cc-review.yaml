# cc-review — per-project configuration
# Place this file at your repository root. All fields are optional; defaults shown.

version: 1

# WHEN auto-review runs. The @cc-review ping ALWAYS works regardless of this setting.
#   every_push : review when the PR opens AND on every push to the PR branch
#   pr_open    : review only when the PR is opened or reopened           (default)
#   disabled   : never auto-review — only an @cc-review comment triggers a run
trigger: pr_open

# Primary languages in this repo. Loads the matching strict checklists
# (dotnet / typescript / python / shell) for the reviewers to check against.
languages: []
#  - csharp
#  - typescript

# Glob paths the review should skip.
ignore_paths: []
#  - "docs/**"
#  - "**/*.md"
#  - "**/__snapshots__/**"

# Project-specific conventions appended to the reviewer context.
instructions: ""
#  instructions: |
#    FastAPI + SQLAlchemy. All DB work goes through repositories.
#    Wolverine handles durable messaging — do not flag the queue indirection.

# Intentional patterns the reviewer must NOT flag (prevents recurring false positives).
known_patterns: []
#  - "Broad exception handlers in middleware are intentional."
